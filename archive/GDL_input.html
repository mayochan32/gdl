<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDL — Ghost Description Language 入力フォーム</title>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161b25;
    --surface2: #1e2535;
    --border: #2a3347;
    --accent: #5b8cff;
    --accent2: #7c5cfc;
    --accent-glow: rgba(91,140,255,0.18);
    --text: #e8ecf4;
    --text-dim: #8a97b0;
    --text-dimmer: #505a70;
    --success: #3ecf8e;
    --warning: #f5a623;
    --rank-colors: #ff6b6b, #ff9f43, #ffd32a, #1dd1a1, #48dbfb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  header {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
  }
  .logo-ghost {
    font-size: 22px;
    filter: drop-shadow(0 0 8px var(--accent));
  }
  .logo-text { font-size: 18px; font-weight: 700; letter-spacing: 0.05em; }
  .logo-text span { color: var(--accent); }
  .header-sub { font-size: 12px; color: var(--text-dim); margin-left: auto; }

  /* ── PROGRESS ── */
  #progress-bar-wrap {
    background: var(--surface);
    padding: 10px 32px 14px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .progress-track {
    height: 4px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  /* ── SECTION TABS ── */
  #section-tabs {
    display: flex;
    gap: 6px;
    padding: 14px 32px;
    overflow-x: auto;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  #section-tabs::-webkit-scrollbar { display: none; }
  .sec-tab {
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 12px;
    white-space: nowrap;
    cursor: pointer;
    border: 1px solid var(--border);
    color: var(--text-dim);
    transition: all 0.2s;
    background: transparent;
  }
  .sec-tab:hover { border-color: var(--accent); color: var(--accent); }
  .sec-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .sec-tab.done { border-color: var(--success); color: var(--success); }
  .sec-tab.done::before { content: '✓ '; }

  /* ── MAIN LAYOUT ── */
  main {
    flex: 1;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  /* ── SECTION HEADER ── */
  .section-header {
    margin-bottom: 28px;
  }
  .section-label {
    font-size: 13px;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .section-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .section-desc {
    font-size: 14px;
    color: var(--text-dim);
  }

  /* ── QUESTION CARD ── */
  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
    transition: border-color 0.2s;
  }
  .q-card:focus-within { border-color: var(--accent); }
  .q-id {
    font-size: 11px;
    color: var(--text-dimmer);
    font-weight: 600;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }
  .q-text {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 4px;
    line-height: 1.5;
  }
  .q-example {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 14px;
    font-style: italic;
  }
  .q-type-badge {
    display: inline-block;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
    margin-bottom: 14px;
    letter-spacing: 0.05em;
  }
  .badge-select   { background: rgba(91,140,255,0.15); color: var(--accent); border: 1px solid rgba(91,140,255,0.3); }
  .badge-multi    { background: rgba(124,92,252,0.15); color: var(--accent2); border: 1px solid rgba(124,92,252,0.3); }
  .badge-scale    { background: rgba(62,207,142,0.12); color: var(--success); border: 1px solid rgba(62,207,142,0.3); }
  .badge-rank     { background: rgba(245,166,35,0.12); color: var(--warning); border: 1px solid rgba(245,166,35,0.3); }
  .badge-direct   { background: rgba(255,255,255,0.07); color: var(--text-dim); border: 1px solid var(--border); }

  /* ── DIRECT INPUT ── */
  .direct-field { margin-bottom: 12px; }
  .direct-label {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 5px;
    display: block;
  }
  .direct-input {
    width: 100%;
    padding: 10px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .direct-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .direct-input::placeholder { color: var(--text-dimmer); }

  /* ── SELECT (radio style) ── */
  .select-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .sel-btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.15s;
    user-select: none;
  }
  .sel-btn:hover { border-color: var(--accent); color: var(--text); }
  .sel-btn.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 0 12px rgba(91,140,255,0.3);
  }

  /* ── MULTI SELECT ── */
  .multi-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .multi-btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.15s;
    user-select: none;
    position: relative;
  }
  .multi-btn:hover { border-color: var(--accent2); color: var(--text); }
  .multi-btn.selected {
    background: rgba(124,92,252,0.2);
    border-color: var(--accent2);
    color: var(--text);
    font-weight: 600;
  }
  .multi-btn.selected::after {
    content: '✓';
    position: absolute;
    top: -6px;
    right: -6px;
    width: 16px;
    height: 16px;
    background: var(--accent2);
    border-radius: 50%;
    font-size: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 900;
  }
  .multi-btn.disabled {
    opacity: 0.35;
    cursor: not-allowed;
    pointer-events: none;
  }
  .multi-limit {
    font-size: 12px;
    color: var(--text-dimmer);
    margin-bottom: 10px;
  }

  /* ── SCALE ── */
  .scale-item {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    transition: border-color 0.2s;
  }
  .scale-item:has(.scale-btn.selected) { border-color: var(--border); }
  .scale-label {
    flex: 1;
    font-size: 14px;
    color: var(--text);
  }
  .scale-buttons {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .scale-btn {
    width: 34px;
    height: 34px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    transition: all 0.15s;
    user-select: none;
  }
  .scale-btn:hover { border-color: var(--success); color: var(--success); }
  .scale-btn.selected {
    background: var(--success);
    border-color: var(--success);
    color: #fff;
    box-shadow: 0 0 8px rgba(62,207,142,0.3);
  }
  .scale-ends {
    display: flex;
    justify-content: flex-end;
    gap: 4px;
    margin-top: -8px;
    margin-bottom: 16px;
    padding-right: 2px;
  }
  .scale-end-label {
    font-size: 10px;
    color: var(--text-dimmer);
    width: 34px;
    text-align: center;
  }

  /* ── RANK ── */
  .rank-note {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .rank-selected-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
    min-height: 40px;
    padding: 8px;
    background: var(--surface2);
    border: 1px dashed var(--border);
    border-radius: 8px;
    align-items: center;
  }
  .rank-slot {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--surface);
    border: 1px solid var(--warning);
    border-radius: 6px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
  }
  .rank-badge {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 900;
    color: #000;
    flex-shrink: 0;
  }
  .rank-slot:hover { background: rgba(245,166,35,0.15); }
  .rank-pool {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .rank-pool-btn {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.15s;
    user-select: none;
  }
  .rank-pool-btn:hover { border-color: var(--warning); color: var(--text); }
  .rank-pool-btn.used { opacity: 0.3; pointer-events: none; }

  /* ── SUPPLEMENTARY ── */
  .supp-wrap { margin-top: 12px; }
  .supp-label { font-size: 12px; color: var(--text-dim); margin-bottom: 5px; display: block; }

  /* ── NAVIGATION ── */
  .nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 36px;
    gap: 12px;
  }
  .nav-btn {
    padding: 12px 28px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
  }
  .nav-btn-prev {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .nav-btn-prev:hover { border-color: var(--text-dim); color: var(--text); }
  .nav-btn-next {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #fff;
    box-shadow: 0 4px 16px rgba(91,140,255,0.3);
  }
  .nav-btn-next:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(91,140,255,0.45); }
  .nav-btn-generate {
    background: linear-gradient(135deg, #3ecf8e, #1b9e6e);
    color: #fff;
    box-shadow: 0 4px 16px rgba(62,207,142,0.3);
  }
  .nav-btn-generate:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(62,207,142,0.45); }
  .nav-center { font-size: 13px; color: var(--text-dimmer); }

  /* ── RESULT SCREEN ── */
  #result-screen { display: none; }
  .result-header {
    text-align: center;
    padding: 32px 0 24px;
  }
  .result-ghost { font-size: 48px; margin-bottom: 12px; }
  .result-title { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
  .result-sub { font-size: 14px; color: var(--text-dim); }

  .result-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin: 24px 0;
    flex-wrap: wrap;
  }
  .action-btn {
    padding: 12px 24px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .action-btn-dl {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #fff;
    box-shadow: 0 4px 14px rgba(91,140,255,0.3);
  }
  .action-btn-dl:hover { transform: translateY(-1px); }
  .action-btn-copy {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .action-btn-copy:hover { border-color: var(--accent); }
  .action-btn-reset {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .action-btn-reset:hover { border-color: var(--text-dim); color: var(--text); }

  .json-viewer {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    font-family: 'Fira Code', 'Consolas', monospace;
    font-size: 13px;
    line-height: 1.7;
    overflow-x: auto;
    max-height: 480px;
    overflow-y: auto;
    white-space: pre;
    color: #a8b4cf;
  }
  .json-key { color: #79b8ff; }
  .json-str { color: #9ecbff; }
  .json-num { color: #f8c555; }
  .json-bool { color: #f97583; }
  .json-null { color: var(--text-dimmer); }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface);
    border: 1px solid var(--success);
    color: var(--success);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 999;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 600px) {
    header { padding: 14px 16px; }
    main { padding: 20px 14px 60px; }
    #progress-bar-wrap { padding: 8px 16px 12px; }
    #section-tabs { padding: 10px 16px; }
    .scale-item { flex-direction: column; align-items: flex-start; }
    .scale-buttons { align-self: flex-end; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-ghost">👻</div>
  <div>
    <div class="logo-text"><span>GDL</span> Ghost Description Language</div>
  </div>
  <div class="header-sub">v1.1 入力フォーム</div>
</header>

<div id="progress-bar-wrap">
  <div class="progress-meta">
    <span id="prog-section-label"></span>
    <span id="prog-count"></span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
</div>

<div id="section-tabs"></div>

<main>
  <div id="form-screen">
    <div class="section-header">
      <div class="section-label" id="sec-label"></div>
      <div class="section-title" id="sec-title"></div>
      <div class="section-desc" id="sec-desc"></div>
    </div>
    <div id="questions-container"></div>
    <div class="nav-bar">
      <button class="nav-btn nav-btn-prev" id="btn-prev" onclick="prevSection()">← 戻る</button>
      <div class="nav-center" id="nav-center-text"></div>
      <button class="nav-btn nav-btn-next" id="btn-next" onclick="nextSection()">次へ →</button>
    </div>
  </div>

  <div id="result-screen">
    <div class="result-header">
      <div class="result-ghost">👻</div>
      <div class="result-title">GDL 生成完了</div>
      <div class="result-sub">あなたの Ghost Description Language が生成されました</div>
    </div>
    <div class="result-actions">
      <button class="action-btn action-btn-dl" onclick="downloadGDL()">⬇ JSON ダウンロード</button>
      <button class="action-btn action-btn-copy" onclick="copyGDL()">📋 クリップボードにコピー</button>
      <button class="action-btn action-btn-reset" onclick="resetForm()">🔄 最初からやり直す</button>
    </div>
    <pre class="json-viewer" id="json-output"></pre>
  </div>
</main>

<div id="toast"></div>

<script>
// ──────────────────────────────
// DATA
// ──────────────────────────────
const SECTIONS = [
  { id: 'S1_identity_appearance', label: 'S1', title: 'プロフィール・外見', desc: '基本情報と外見について教えてください。名前・生年のみ直接入力、他はすべて選択式です。' },
  { id: 'S2_background',          label: 'S2', title: '経歴・経験',         desc: '学歴・職歴・人生の転機などを選択してください。' },
  { id: 'S3_philosophy',          label: 'S3', title: '思想・哲学',         desc: 'あなたの価値観・人生観・信念を選択してください。' },
  { id: 'S4_personality',         label: 'S4', title: '性格・行動傾向',     desc: '感情・対処行動・こだわりについて評価・選択してください。' },
  { id: 'S5_knowledge_preferences', label: 'S5', title: '知識・興味・嗜好', desc: '専門領域・趣味・好みのスタイルを選んでください。' },
  { id: 'S6_expression_communication', label: 'S6', title: '表現・コミュニケーション', desc: '話し方・伝え方・対話スタイルについて教えてください。' },
  { id: 'S7_relationships',       label: 'S7', title: '人間関係',           desc: '家族・友人・社会への向き合い方を教えてください。' },
];

const RANK_COLORS = ['#ff6b6b','#ff9f43','#ffd32a','#1dd1a1','#48dbfb','#c8d6e5'];

const QUESTIONS = [
  { id:'Q01', section:'S1_identity_appearance', type:'direct',
    text:'名前を教えてください',
    sub_prompts:[
      {key:'kanji',    label:'漢字'},
      {key:'kana',     label:'ひらがな'},
      {key:'romaji',   label:'ローマ字'},
      {key:'nickname', label:'ニックネーム・呼ばれたい名前（任意）'}
    ],
    maps_to:['identity.name.kanji','identity.name.kana','identity.name.romaji','identity.nickname']
  },
  { id:'Q02', section:'S1_identity_appearance', type:'direct',
    text:'生まれた年（西暦4桁）を入力してください',
    sub_prompts:[{key:'birth_year', label:'生年（例：1980）'}],
    maps_to:['identity.birth_year']
  },
  { id:'Q03', section:'S1_identity_appearance', type:'select',
    text:'性別を選んでください',
    candidates:['男性','女性','ノンバイナリー','その他','回答しない'],
    maps_to:['identity.gender']
  },
  { id:'Q04', section:'S1_identity_appearance', type:'select',
    text:'現在のライフステージを選んでください',
    candidates:['学生（高校生以下）','学生（大学・大学院）','社会人・若手（〜5年）','社会人・中堅（5〜15年）','社会人・ベテラン（15年〜）','管理職・リーダー','経営者・役員','フリーランス・個人事業主','定年後・セカンドキャリア','その他'],
    maps_to:['identity.life_stage']
  },
  { id:'Q05', section:'S1_identity_appearance', type:'multi_select', max_select:5,
    text:'自分を表すキーワードを選んでください（最大5つ）',
    candidates:['エンジニア・技術者','研究者・探求者','クリエイター・表現者','経営者・リーダー','教育者・伝える人','支える人・縁の下の力持ち','分析家・論理派','アーティスト・感性派','冒険家・挑戦者','哲学者・思想家','父・母・親','パートナー・伴侶','コミュニティの中心人物','一匹狼・個人主義','社会変革者','その他'],
    maps_to:['identity.identity_keywords','identity.occupation_summary','personality.self_image']
  },
  { id:'Q06', section:'S1_identity_appearance', type:'direct',
    text:'身長（cm）を入力してください',
    sub_prompts:[{key:'height_cm', label:'身長（例：175）'}],
    maps_to:['appearance.height_cm']
  },
  { id:'Q07', section:'S1_identity_appearance', type:'select',
    text:'体型を選んでください',
    candidates:['細身','やや細め','普通','やや大柄','がっちり・筋肉質','ふくよか'],

// ──────────────────────────────
// STATE
// ──────────────────────────────
let currentSection = 0;
const answers = {};  // { qId: value }

function getSectionQuestions(secId) {
  return QUESTIONS.filter(q => q.section === secId);
}

// ──────────────────────────────
// RENDER
// ──────────────────────────────
function render() {
  const sec = SECTIONS[currentSection];
  const qs = getSectionQuestions(sec.id);

  // header
  document.getElementById('sec-label').textContent = `セクション ${currentSection + 1} / ${SECTIONS.length}`;
  document.getElementById('sec-title').textContent = sec.title;
  document.getElementById('sec-desc').textContent  = sec.desc;

  // progress
  const totalQ = QUESTIONS.length;
  const doneQ  = QUESTIONS.filter(q => answers[q.id] !== undefined).length;
  document.getElementById('prog-section-label').textContent = sec.title;
  document.getElementById('prog-count').textContent = `${doneQ} / ${totalQ} 問回答済み`;
  document.getElementById('progress-fill').style.width = `${(doneQ/totalQ)*100}%`;

  // tabs
  renderTabs();

  // questions
  const container = document.getElementById('questions-container');
  container.innerHTML = '';
  qs.forEach(q => container.appendChild(buildCard(q)));

  // nav
  document.getElementById('btn-prev').style.visibility = currentSection === 0 ? 'hidden' : 'visible';
  const isLast = currentSection === SECTIONS.length - 1;
  const btn = document.getElementById('btn-next');
  if (isLast) {
    btn.textContent = '✨ GDL を生成する';
    btn.className = 'nav-btn nav-btn-generate';
    btn.onclick = generateGDL;
  } else {
    btn.textContent = '次へ →';
    btn.className = 'nav-btn nav-btn-next';
    btn.onclick = nextSection;
  }
  document.getElementById('nav-center-text').textContent =
    `${currentSection + 1} / ${SECTIONS.length} セクション`;
}

function renderTabs() {
  const container = document.getElementById('section-tabs');
  container.innerHTML = '';
  SECTIONS.forEach((sec, i) => {
    const qs = getSectionQuestions(sec.id);
    const allAnswered = qs.every(q => answers[q.id] !== undefined);
    const btn = document.createElement('button');
    btn.className = 'sec-tab' + (i === currentSection ? ' active' : '') + (allAnswered && i !== currentSection ? ' done' : '');
    btn.textContent = sec.label + ' ' + sec.title;
    btn.onclick = () => { currentSection = i; render(); };
    container.appendChild(btn);
  });
}

function buildCard(q) {
  const card = document.createElement('div');
  card.className = 'q-card';
  card.id = `card-${q.id}`;

  const idEl = document.createElement('div');
  idEl.className = 'q-id';
  idEl.textContent = q.id;
  card.appendChild(idEl);

  const textEl = document.createElement('div');
  textEl.className = 'q-text';
  textEl.textContent = q.text;
  card.appendChild(textEl);

  const badgeMap = {direct:'badge-direct', select:'badge-select', multi_select:'badge-multi', scale:'badge-scale', rank:'badge-rank'};
  const labelMap = {direct:'直接入力', select:'単一選択', multi_select:'複数選択', scale:'5段階評価', rank:'ランク選択'};
  const badge = document.createElement('div');
  badge.className = `q-type-badge ${badgeMap[q.type]}`;
  badge.textContent = labelMap[q.type];
  card.appendChild(badge);

  // input area
  if (q.type === 'direct')        card.appendChild(buildDirect(q));
  else if (q.type === 'select')   card.appendChild(buildSelect(q));
  else if (q.type === 'multi_select') card.appendChild(buildMulti(q));
  else if (q.type === 'scale')    card.appendChild(buildScale(q));
  else if (q.type === 'rank')     card.appendChild(buildRank(q));

  // supplementary
  if (q.supplementary_input) {
    const sw = document.createElement('div');
    sw.className = 'supp-wrap';
    const sl = document.createElement('label');
    sl.className = 'supp-label';
    sl.textContent = q.supplementary_label;
    const si = document.createElement('input');
    si.type = 'text';
    si.className = 'direct-input';
    si.placeholder = '任意';
    const suppKey = q.id + '_supp';
    si.value = answers[suppKey] || '';
    si.addEventListener('input', () => {
      answers[suppKey] = si.value;
    });
    sw.appendChild(sl);
    sw.appendChild(si);
    card.appendChild(sw);
  }

  return card;
}

function buildDirect(q) {
  const wrap = document.createElement('div');
  if (q.sub_prompts) {
    const val = answers[q.id] || {};
    q.sub_prompts.forEach(sp => {
      const f = document.createElement('div');
      f.className = 'direct-field';
      const l = document.createElement('label');
      l.className = 'direct-label';
      l.textContent = sp.label;
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'direct-input';
      inp.placeholder = sp.label;
      inp.value = val[sp.key] || '';
      inp.addEventListener('input', () => {
        if (!answers[q.id]) answers[q.id] = {};
        answers[q.id][sp.key] = inp.value;
      });
      f.appendChild(l);
      f.appendChild(inp);
      wrap.appendChild(f);
    });
  } else {
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'direct-input';
    inp.placeholder = q.input_format || '入力してください';
    inp.value = answers[q.id] || '';
    inp.addEventListener('input', () => { answers[q.id] = inp.value; });
    wrap.appendChild(inp);
  }
  return wrap;
}

function buildSelect(q) {
  const wrap = document.createElement('div');
  wrap.className = 'select-grid';
  q.candidates.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'sel-btn' + (answers[q.id] === c ? ' selected' : '');
    btn.textContent = c;
    btn.onclick = () => {
      answers[q.id] = c;
      wrap.querySelectorAll('.sel-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      updateProgress();
    };
    wrap.appendChild(btn);
  });
  return wrap;
}

function buildMulti(q) {
  const wrap = document.createElement('div');
  const max = q.max_select;
  if (max) {
    const note = document.createElement('div');
    note.className = 'multi-limit';
    note.textContent = `最大 ${max} つまで選択できます`;
    note.id = `limit-${q.id}`;
    wrap.appendChild(note);
  }
  const grid = document.createElement('div');
  grid.className = 'multi-grid';
  if (!answers[q.id]) answers[q.id] = [];
  q.candidates.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'multi-btn' + (answers[q.id].includes(c) ? ' selected' : '');
    btn.textContent = c;
    if (max && answers[q.id].length >= max && !answers[q.id].includes(c)) {
      btn.classList.add('disabled');
    }
    btn.onclick = () => {
      if (!answers[q.id]) answers[q.id] = [];
      if (answers[q.id].includes(c)) {
        answers[q.id] = answers[q.id].filter(x => x !== c);
        btn.classList.remove('selected');
      } else {
        if (max && answers[q.id].length >= max) return;
        answers[q.id].push(c);
        btn.classList.add('selected');
      }
      // update disabled state
      grid.querySelectorAll('.multi-btn').forEach(b => {
        const bc = b.textContent;
        if (max && answers[q.id].length >= max && !answers[q.id].includes(bc)) {
          b.classList.add('disabled');
        } else {
          b.classList.remove('disabled');
        }
      });
      updateProgress();
    };
    grid.appendChild(btn);
  });
  wrap.appendChild(grid);
  return wrap;
}

function buildScale(q) {
  const wrap = document.createElement('div');
  if (!answers[q.id]) answers[q.id] = {};
  q.items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'scale-item';
    const lbl = document.createElement('div');
    lbl.className = 'scale-label';
    lbl.textContent = item.label;
    row.appendChild(lbl);
    const btns = document.createElement('div');
    btns.className = 'scale-buttons';
    for (let v = 1; v <= 5; v++) {
      const b = document.createElement('button');
      b.className = 'scale-btn' + (answers[q.id][item.key] === v ? ' selected' : '');
      b.textContent = v;
      b.onclick = () => {
        answers[q.id][item.key] = v;
        btns.querySelectorAll('.scale-btn').forEach(x => x.classList.remove('selected'));
        b.classList.add('selected');
        updateProgress();
      };
      btns.appendChild(b);
    }
    row.appendChild(btns);
    wrap.appendChild(row);
  });
  // end labels
  const ends = document.createElement('div');
  ends.className = 'scale-ends';
  ['','','','弱→','','→強'].forEach((t,i)=>{
    const sp = document.createElement('span');
    sp.className = 'scale-end-label';
    sp.textContent = i===3 ? '弱' : i===5 ? '強' : '';
    ends.appendChild(sp);
  });
  return wrap;
}

function buildRank(q) {
  const wrap = document.createElement('div');
  const max = q.max_select || 3;
  const note = document.createElement('div');
  note.className = 'rank-note';
  note.textContent = `上位 ${max} つをクリックして選んでください（クリック順に順位がつきます）`;
  wrap.appendChild(note);

  if (!answers[q.id]) answers[q.id] = [];

  // selected row
  const selRow = document.createElement('div');
  selRow.className = 'rank-selected-row';
  selRow.id = `rank-sel-${q.id}`;

  const pool = document.createElement('div');
  pool.className = 'rank-pool';
  pool.id = `rank-pool-${q.id}`;

  function refreshRank() {
    selRow.innerHTML = '';
    if (answers[q.id].length === 0) {
      const ph = document.createElement('span');
      ph.style.cssText = 'font-size:12px;color:var(--text-dimmer)';
      ph.textContent = '選んだ順に表示されます';
      selRow.appendChild(ph);
    } else {
      answers[q.id].forEach((c, idx) => {
        const slot = document.createElement('div');
        slot.className = 'rank-slot';
        slot.title = 'クリックで取り消し';
        const badge = document.createElement('span');
        badge.className = 'rank-badge';
        badge.style.background = RANK_COLORS[idx] || '#888';
        badge.textContent = idx + 1;
        slot.appendChild(badge);
        slot.appendChild(document.createTextNode(c));
        slot.onclick = () => {
          answers[q.id] = answers[q.id].filter(x => x !== c);
          refreshRank();
          pool.querySelectorAll('.rank-pool-btn').forEach(b => {
            if (b.textContent === c) b.classList.remove('used');
          });
        };
        selRow.appendChild(slot);
      });
    }
    // update pool disabled
    pool.querySelectorAll('.rank-pool-btn').forEach(b => {
      if (answers[q.id].includes(b.textContent)) b.classList.add('used');
      else b.classList.remove('used');
    });
    updateProgress();
  }

  q.candidates.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'rank-pool-btn' + (answers[q.id].includes(c) ? ' used' : '');
    btn.textContent = c;
    btn.onclick = () => {
      if (answers[q.id].includes(c)) return;
      if (answers[q.id].length >= max) return;
      answers[q.id].push(c);
      refreshRank();
    };
    pool.appendChild(btn);
  });

  wrap.appendChild(selRow);
  wrap.appendChild(pool);
  refreshRank();
  return wrap;
}

function updateProgress() {
  const totalQ = QUESTIONS.length;
  const doneQ  = QUESTIONS.filter(q => {
    const a = answers[q.id];
    if (a === undefined) return false;
    if (Array.isArray(a) && a.length === 0) return false;
    if (typeof a === 'object' && !Array.isArray(a) && Object.keys(a).length === 0) return false;
    return true;
  }).length;
  document.getElementById('prog-count').textContent = `${doneQ} / ${totalQ} 問回答済み`;
  document.getElementById('progress-fill').style.width = `${(doneQ/totalQ)*100}%`;
  renderTabs();
}

// ──────────────────────────────
// NAVIGATION
// ──────────────────────────────
function nextSection() {
  if (currentSection < SECTIONS.length - 1) {
    currentSection++;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }
}
function prevSection() {
  if (currentSection > 0) {
    currentSection--;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }
}

// ──────────────────────────────
// GDL GENERATION
// ──────────────────────────────
function setNestedKey(obj, path, value) {
  const parts = path.split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    if (!cur[parts[i]]) cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  const last = parts[parts.length - 1];
  if (cur[last] !== undefined) {
    // merge arrays
    if (Array.isArray(cur[last]) && Array.isArray(value)) {
      cur[last] = [...new Set([...cur[last], ...value])];
    } else if (typeof cur[last] === 'object' && typeof value === 'object') {
      Object.assign(cur[last], value);
    }
  } else {
    cur[last] = value;
  }
}

function generateGDL() {
  const gdl = {
    meta: {
      gdl_version: "1.0",
      created_at: new Date().toISOString().slice(0,10),
      detail_level: 1
    },
    identity: {},
    appearance: {},
    background: {},
    philosophy: {},
    personality: {},
    knowledge: {},
    preferences: {},
    expression: {},
    relationships: {}
  };

  QUESTIONS.forEach(q => {
    const a = answers[q.id];
    if (a === undefined || a === '' || (Array.isArray(a) && a.length === 0)) return;
    if (typeof a === 'object' && !Array.isArray(a) && Object.keys(a).length === 0) return;

    if (q.type === 'direct' && q.sub_prompts) {
      // map sub_prompts to maps_to fields
      q.sub_prompts.forEach((sp, i) => {
        const val = a[sp.key];
        if (val && q.maps_to[i]) {
          setNestedKey(gdl, q.maps_to[i], val);
        }
      });
    } else {
      // For scale: maps_to[0] gets the whole object
      // For others: maps_to each gets the same value
      q.maps_to.forEach(field => {
        if (q.type === 'scale') {
          setNestedKey(gdl, field, a);
        } else if (q.type === 'rank') {
          setNestedKey(gdl, field, a);
        } else if (q.type === 'multi_select') {
          const existing = getNestedKey(gdl, field);
          if (Array.isArray(existing)) {
            setNestedKey(gdl, field, [...new Set([...existing, ...a])]);
          } else {
            setNestedKey(gdl, field, [...a]);
          }
        } else {
          setNestedKey(gdl, field, a);
        }
      });
    }

    // supplementary
    const suppKey = q.id + '_supp';
    if (answers[suppKey]) {
      const suppField = q.maps_to[0] + '_note';
      setNestedKey(gdl, suppField, answers[suppKey]);
    }
  });

  // clean empty sections
  Object.keys(gdl).forEach(k => {
    if (k === 'meta') return;
    if (typeof gdl[k] === 'object' && !Array.isArray(gdl[k]) && Object.keys(gdl[k]).length === 0) {
      delete gdl[k];
    }
  });

  const output = { gdl };
  showResult(output);
}

function getNestedKey(obj, path) {
  return path.split('.').reduce((cur, k) => cur && cur[k], obj);
}

// ──────────────────────────────
// RESULT
// ──────────────────────────────
let lastGDL = null;

function showResult(data) {
  lastGDL = data;
  document.getElementById('form-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});

  const jsonStr = JSON.stringify(data, null, 2);
  const highlighted = jsonStr
    .replace(/("[\w.\[\]_]+"):/g, '<span class="json-key">$1</span>:')
    .replace(/: (".*?")/g, ': <span class="json-str">$1</span>')
    .replace(/: (\d+\.?\d*)/g, ': <span class="json-num">$1</span>')
    .replace(/: (true|false)/g, ': <span class="json-bool">$1</span>')
    .replace(/: (null)/g, ': <span class="json-null">$1</span>');
  document.getElementById('json-output').innerHTML = highlighted;
}

function downloadGDL() {
  if (!lastGDL) return;
  const name = lastGDL.gdl?.identity?.name?.kanji || 'ghost';
  const blob = new Blob([JSON.stringify(lastGDL, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `GDL_${name}_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  showToast('ダウンロードを開始しました ✓');
}

function copyGDL() {
  if (!lastGDL) return;
  navigator.clipboard.writeText(JSON.stringify(lastGDL, null, 2))
    .then(() => showToast('クリップボードにコピーしました ✓'))
    .catch(() => showToast('コピーに失敗しました'));
}

function resetForm() {
  if (!confirm('回答をすべてリセットして最初からやり直しますか？')) return;
  Object.keys(answers).forEach(k => delete answers[k]);
  currentSection = 0;
  document.getElementById('form-screen').style.display = 'block';
  document.getElementById('result-screen').style.display = 'none';
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ──────────────────────────────
// INIT
// ──────────────────────────────
render();
</script>
