<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Five 性格診断 — 回答フォーム (GDL忠実度評価)</title>
<style>
  :root{
    --bg:#0f1216; --card:#171b22; --card2:#1d222b; --line:#2a313c;
    --fg:#e7ecf3; --muted:#9aa6b6; --accent:#4f9cf9; --accent2:#36c692;
    --pick:#2b4a6b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
    line-height:1.6}
  .wrap{max-width:860px;margin:0 auto;padding:20px 16px 140px}
  h1{font-size:1.35rem;margin:.2em 0}
  .sub{color:var(--muted);font-size:.9rem;margin-bottom:16px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  label.fld{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  input,select{background:var(--card2);color:var(--fg);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;font-size:.95rem}
  input[type=text]{min-width:160px}
  .legend{font-size:.85rem;color:var(--muted);margin-top:10px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:12px}
  .q.answered{border-color:#2f5d49}
  .qhead{display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
  .qnum{color:var(--muted);font-variant-numeric:tabular-nums;min-width:34px}
  .qtext{font-size:1.05rem;font-weight:600}
  .qtext .alt{display:block;font-weight:400;font-size:.85rem;color:var(--muted);margin-top:2px}
  .opts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .opt{cursor:pointer;border:1px solid var(--line);background:var(--card2);
    border-radius:10px;padding:10px 6px;text-align:center;user-select:none;transition:.12s}
  .opt:hover{border-color:var(--accent)}
  .opt .n{font-size:1.1rem;font-weight:700;display:block}
  .opt .t{font-size:.72rem;color:var(--muted);display:block;margin-top:2px}
  .opt.sel{background:var(--accent);border-color:var(--accent);color:#0a1320}
  .opt.sel .t{color:#0a1320}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#10141b;
    border-top:1px solid var(--line);padding:12px 16px}
  .barin{max-width:860px;margin:0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .prog{flex:1;min-width:160px}
  .track{height:8px;background:var(--card2);border-radius:6px;overflow:hidden}
  .fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.2s}
  .cnt{font-size:.85rem;color:var(--muted);margin-top:4px}
  button.act{background:var(--accent2);color:#062018;border:none;border-radius:9px;
    padding:10px 16px;font-size:.95rem;font-weight:700;cursor:pointer}
  button.act:disabled{opacity:.4;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
  .toggle{margin-left:auto}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);
    background:#23303f;border:1px solid var(--accent);color:var(--fg);
    padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1}
  a.dl{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Big Five 性格診断 — 回答フォーム</h1>
  <div class="sub">GDL忠実度評価（性格診断法）／ IPIP-NEO-120。各文が自分にどれだけ当てはまるかをクリックで選び、最後に結果JSONを書き出します。</div>

  <div class="panel">
    <div class="row">
      <label class="fld">被験者名 (subject)
        <input type="text" id="subject" placeholder="mayo" value="mayo">
      </label>
      <label class="fld">条件 (condition)
        <input type="text" id="condition" value="human" readonly
               title="このフォームは人間本人(human)専用です。AIの回答は別フロー(方式A)で取得します。"
               style="width:130px;opacity:.75;cursor:not-allowed">
      </label>
      <label class="fld">反復回数 (run)
        <input type="text" id="run" value="1" style="width:70px">
      </label>
      <button class="act ghost toggle" id="langBtn">English ⇄ 日本語</button>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <div id="list"></div>
</div>

<div class="bar">
  <div class="barin">
    <div class="prog">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="cnt" id="cnt">0 / 120 回答済み</div>
    </div>
    <button class="act ghost" id="resetBtn">リセット</button>
    <button class="act" id="dlBtn" disabled>結果JSONをダウンロード</button>
    <button class="act ghost" id="copyBtn" disabled>JSONをコピー</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<a class="dl" id="dlLink"></a>

<script>
const ITEMS = [{"num": 1, "ja": "心配性だ", "en": "Worry about things"}, {"num": 2, "ja": "友達を作るのは簡単だ", "en": "Make friends easily"}, {"num": 3, "ja": "想像力が豊かだ", "en": "Have a vivid imagination"}, {"num": 4, "ja": "他人を信頼するほうだ", "en": "Trust others"}, {"num": 5, "ja": "仕事は完璧にこなすほうだ", "en": "Complete tasks successfully"}, {"num": 6, "ja": "短気だ", "en": "Get angry easily"}, {"num": 7, "ja": "大きなパーティが好きだ", "en": "Love large parties"}, {"num": 8, "ja": "芸術は重要だと思う", "en": "Believe in the importance of art"}, {"num": 9, "ja": "自分のために他人を利用するほうだ", "en": "Use others for my own ends"}, {"num": 10, "ja": "きれい好きだ", "en": "Like to tidy up"}, {"num": 11, "ja": "憂鬱な気分になることが多い", "en": "Often feel blue"}, {"num": 12, "ja": "世話を焼きがちだ", "en": "Take charge"}, {"num": 13, "ja": "感情的なほうだ", "en": "Experience my emotions intensely"}, {"num": 14, "ja": "人助けが好きだ", "en": "Love to help others"}, {"num": 15, "ja": "約束は守るほうだ", "en": "Keep my promises"}, {"num": 16, "ja": "他人に近づくことが苦手だ", "en": "Find it difficult to approach others"}, {"num": 17, "ja": "いつも忙しいほうだ", "en": "Am always busy"}, {"num": 18, "ja": "いつも同じよりも変化に富むことを好む", "en": "Prefer variety to routine"}, {"num": 19, "ja": "健闘することが大好きだ", "en": "Love a good fight"}, {"num": 20, "ja": "一生懸命に働くほうだ", "en": "Work hard"}, {"num": 21, "ja": "暴飲暴食をしがちだ", "en": "Go on binges"}, {"num": 22, "ja": "刺激的なことが大好きだ", "en": "Love excitement"}, {"num": 23, "ja": "難しい読み物が好きだ", "en": "Love to read challenging material"}, {"num": 24, "ja": "自分は他人よりも優れていると思う", "en": "Believe that I am better than others"}, {"num": 25, "ja": "いつも準備万端だ", "en": "Am always prepared"}, {"num": 26, "ja": "慌てやすい", "en": "Panic easily"}, {"num": 27, "ja": "喜びで満ち溢れている", "en": "Radiate joy"}, {"num": 28, "ja": "選挙ではリベラルな候補者に投票するほうだ", "en": "Tend to vote for liberal political candidates"}, {"num": 29, "ja": "ホームレスには同情する", "en": "Sympathize with the homeless"}, {"num": 30, "ja": "考えなしに行動しがちだ", "en": "Jump into things without thinking"}, {"num": 31, "ja": "最悪の結果を恐れがちだ", "en": "Fear for the worst い人に同情する", "en": "Feel sympathy for those who are worse off than myself"}, {"num": 60, "ja": "衝動的な意思決定をしがちだ", "en": "Make rash decisions"}, {"num": 61, "ja": "さまざまなことに対して不安がある", "en": "Am afraid of many things"}, {"num": 62, "ja": "他人との接触を避けがちだ", "en": "Avoid contacts with others"}, {"num": 63, "ja": "空想することが好きだ", "en": "Love to daydream"}, {"num": 64, "ja": "人々が言うことは信じるほうだ", "en": "Trust what people say"}, {"num": 65, "ja": "仕事はスムーズにこなすほうだ", "en": "Handle tasks smoothly"}, {"num": 66, "ja": "キレやすいほうだ", "en": "Lose my temper"}, {"num": 67, "ja": "一人でいることを好む", "en": "Prefer to be alone"}, {"num": 68, "ja": "詩は好きではない", "en": "Do not like poetry"}, {"num": 69, "ja": "他人を利用しがちだ", "en": "Take advantage of others"}, {"num": 70, "ja": "自分の部屋は散らかりがちだ", "en": "Leave a mess in my room"}, {"num": 71, "ja": "気分が沈んでいることが多い", "en": "Am often down in the dumps"}, {"num": 72, "ja": "物事を支配しようとしがちだ", "en": "Take control of things"}, {"num": 73, "ja": "自分の感情の変化に疎いほうだ", "en": "Rarely notice my emotional reactions"}, {"num": 74, "ja": "他人の気持ちに無頓着だ", "en": "Am indifferent to the feelings of others"}, {"num": 75, "ja": "規則を破りがちだ", "en": "Break rules"}, {"num": 76, "ja": "友達といるだけで安らげる", "en": "Only feel comfortable with friends"}, {"num": 77, "ja": "自由時間にはたくさんのことをするほうだ", "en": "Do a lot in my spare time"}, {"num": 78, "ja": "変化を好まない", "en": "Dislike changes"}, {"num": 79, "ja": "人をけなしがちだ", "en": "Insult people"}, {"num": 80, "ja": "必要最低限のことだけをするほうだ", "en": "Do just enough work to get by"}, {"num": 81, "ja": "誘惑に打ち勝つことは簡単だ", "en": "Easily resist temptations"}, {"num": 82, "ja": "無茶をすることは楽しい", "en": "Enjoy being reckless"}, {"num": 83, "ja": "抽象的な考えを理解することは難しい", "en": "Have difficulty understanding abstract ideas"}, {"num": 84, "ja": "自己評価は高いほうだ", "en": "Have a high opinion of myself"}, {"num": 85, "ja": "時間を浪費しがちだ", "en": "Waste my time"}, {"num": 86, "ja": "物事の対処ができないと感じる", "en": "Feel that I'm unable to deal with things"}, {"num": 87, "ja": "人生が大好きだ", "en": "Love life"}, {"num": 88, "ja": "選挙では保守派の候補者に投票するほうだ", "en": "Tend to vote for conservative political candidates"}, {"num": 89, "ja": "他人の問題には興味がないほうだ", "en": "Am not interested in other people's problems"}, {"num": 90, "ja": "慌てて行動しがちだ", "en": "Rush into things"}, {"num": 91, "ja": "ストレスを感じやすい", "en": "Get stressed out easily"}, {"num": 92, "ja": "他人と距離をとりがちだ", "en": "Keep others at a distance"}, {"num": 93, "ja": "思索に耽ることが好きだ", "en": "Like to get lost in thought"}, {"num": 94, "ja": "他人は信用しないほうだ", "en": "Distrust people"}, {"num": 95, "ja": "要領が良いほうだ", "en": "Know how to get things done"}, {"num": 96, "ja": "簡単にイライラしないほうだ", "en": "Am not easily annoyed"}, {"num": 97, "ja": "人混みを避けがちだ", "en": "Avoid crowds"}, {"num": 98, "ja": "美術館に行っても楽しめない", "en": "Do not enjoy going to art museums"}, {"num": 99, "ja": "他人の計画を妨害しがちだ", "en": "Obstruct others' plans"}, {"num": 100, "ja": "自分の所有物を放置しがちだ", "en": "Leave my belongings around"}, {"num": 101, "ja": "今の自分に満足している", "en": "Feel comfortable with myself"}, {"num": 102, "ja": "他人が導いてくれるのを待ちがちだ", "en": "Wait for others to lead the way"}, {"num": 103, "ja": "感情的になる人を理解できない", "en": "Don't understand people who get emotional"}, {"num": 104, "ja": "他人のために時間はかけないほうだ", "en": "Take no time for others"}, {"num": 105, "ja": "約束を反故にしがちだ", "en": "Break my promises"}, {"num": 106, "ja": "困難な社会情勢に悩まされないほうだ", "en": "Am not bothered by difficult social situations"}, {"num": 107, "ja": "気楽にやることが好きだ", "en": "Like to take it easy"}, {"num": 108, "ja": "伝統的なやり方に固執しがちだ", "en": "Am attached to conventional ways"}, {"num": 109, "ja": "他人に仕返しをしがちだ", "en": "Get back at others"}, {"num": 110, "ja": "仕事に時間や労力を割きたくない", "en": "Put little time and effort into my work"}, {"num": 111, "ja": "欲求をコントロールできるほうだ", "en": "Am able to control my cravings"}, {"num": 112, "ja": "無謀に行動するほうだ", "en": "Act wild and crazy"}, {"num": 113, "ja": "理論的な議論には興味がないほうだ", "en": "Am not interested in theoretical discussions"}, {"num": 114, "ja": "自慢しがちだ", "en": "Boast about my virtues"}, {"num": 115, "ja": "仕事を始めることは難しい", "en": "Have difficulty starting tasks"}, {"num": 116, "ja": "プレッシャーの中でも落ち着いていられる", "en": "Remain calm under pressure"}, {"num": 117, "ja": "人生を肯定的に見るほうだ", "en": "Look at the bright side of life"}, {"num": 118, "ja": "犯罪には厳しくあるべきだと思う", "en": "Believe that we should be tough on crime"}, {"num": 119, "ja": "貧しい人のことは考えないようにしている", "en": "Try not to think about the needy"}, {"num": 120, "ja": "考えなしに行動するほうだ", "en": "Act without thinking"}];
const SCALE = {
  ja:["全く当てはまらない","やや当てはまらない","どちらでもない","やや当てはまる","非常に当てはまる"],
  en:["Very Inaccurate","Moderately Inaccurate","Neither","Moderately Accurate","Very Accurate"]
};
const LEGEND = {
  ja:"1=全く当てはまらない ／ 2=やや当てはまらない ／ 3=どちらでもない ／ 4=やや当てはまる ／ 5=非常に当てはまる",
  en:"1=Very Inaccurate / 2=Moderately Inaccurate / 3=Neither / 4=Moderately Accurate / 5=Very Accurate"
};
const KEY="bigfive_form_progress";
let lang="ja";
let answers={}; // num -> 1..5

function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)||"{}");
  if(s.answers) answers=s.answers;
  if(s.subject) subject.value=s.subject;
  if(s.condition) condition.value=s.condition;
  if(s.run) run.value=s.run;
  if(s.lang) lang=s.lang;
}catch(e){} }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(
  {answers,subject:subject.value,condition:condition.value,run:run.value,lang})); }catch(e){} }

const list=document.getElementById("list");
const subject=document.getElementById("subject");
const condition=document.getElementById("condition");
const run=document.getElementById("run");

function render(){
  document.getElementById("legend").textContent=LEGEND[lang];
  document.documentElement.lang=lang;
  list.innerHTML="";
  ITEMS.forEach(it=>{
    const q=document.createElement("div");
    q.className="q"+(answers[it.num]?" answered":"");
    q.id="q"+it.num;
    const primary=lang==="ja"?it.ja:it.en;
    const alt=lang==="ja"?it.en:it.ja;
    q.innerHTML=`<div class="qhead"><span class="qnum">${it.num}.</span>
      <span class="qtext">${primary}<span class="alt">${alt}</span></span></div>
      <div class="opts">${[1,2,3,4,5].map(v=>`
        <div class="opt${answers[it.num]===v?" sel":""}" data-n="${it.num}" data-v="${v}">
          <span class="n">${v}</span><span class="t">${SCALE[lang][v-1]}</span></div>`).join("")}</div>`;
    list.appendChild(q);
  });
  list.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    const n=+o.dataset.n, v=+o.dataset.v;
    answers[n]=v;
    document.querySelectorAll(`#q${n} .opt`).forEach(x=>x.classList.toggle("sel",+x.dataset.v===v));
    document.getElementById("q"+n).classList.add("answered");
    save(); updateProg();
  });
  updateProg();
}
function updateProg(){
  const done=Object.keys(answers).length;
  document.getElementById("fill").style.width=(done/120*100)+"%";
  document.getElementById("cnt").textContent=`${done} / 120 回答済み`;
  const ok=done===120;
  document.getElementById("dlBtn").disabled=!ok;
  document.getElementById("copyBtn").disabled=!ok;
}
function buildJSON(){
  const ans={}; for(let i=1;i<=120;i++) ans[i]=answers[i];
  return {subject:subject.value||"subject",condition:condition.value,
          run:Number(run.value)||1,instrument:"IPIP-NEO-120",answers:ans};
}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1800);}

document.getElementById("dlBtn").onclick=()=>{
  const obj=buildJSON();
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
  const a=document.getElementById("dlLink");
  a.href=URL.createObjectURL(blob);
  a.download=`bigfive_${obj.subject}_${obj.condition}_run${obj.run}.json`;
  a.click(); toast("ダウンロードしました");
};
document.getElementById("copyBtn").onclick=async()=>{
  try{ await navigator.clipboard.writeText(JSON.stringify(buildJSON(),null,2)); toast("JSONをコピーしました"); }
  catch(e){ toast("コピー不可。ダウンロードを使ってください"); }
};
document.getElementById("langBtn").onclick=()=>{lang=lang==="ja"?"en":"ja";save();render();};
document.getElementById("resetBtn").onclick=()=>{
  if(confirm("回答をすべて消去しますか？")){answers={};save();render();toast("リセットしました");}
};
[subject,condition,run].forEach(el=>el.addEventListener("input",save));

load(); render();
</script>
</body>
</html>
